name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm gateway:build
      - run: pnpm gateway:test:coverage
      - run: pnpm rust:azookey:fmt
      - run: pnpm rust:azookey:lint
      - run: pnpm rust:azookey:test

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: pnpm tauri build
          - os: windows-latest
            command: pnpm tauri build -- --features native-output
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
