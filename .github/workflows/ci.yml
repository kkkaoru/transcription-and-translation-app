name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The AzooKey dictionary is a nested submodule of the checked-in
          # converter tree.  A shallow top-level checkout leaves the source
          # present but the dictionary files missing, which makes both the
          # hash check and the Rust conversion tests silently unusable.
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep this in lock-step with package.json's packageManager field.
          bun-version: 1.3.14
      - name: Verify the pinned Bun toolchain
        run: test "$(bun --version)" = "1.3.14"
      # Keep this in lock-step with the repository rust-toolchain.toml.  The
      # older 1.88 pin used to let CI pass while local desktop builds used a
      # different compiler and formatter.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Verify the pinned quality toolchain
        run: |
          set -euo pipefail
          rustc --version | grep -E '^rustc 1\.97\.1([[:space:]]|$)'
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
      - name: Install the nested Parapper toolchain components
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.90.0 rustfmt clippy
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run assets:verify
      - run: bun run test:build-cleanup
      - run: bun run typecheck
      - run: bun run azookey-reading:typecheck
      - run: bun run dictionaries:typecheck
      - run: bun run sentence-boundary:typecheck
      - run: bun run azookey-compare:typecheck
      - run: bun run test:coverage
      - run: bun run core:test:coverage
      - run: bun run azookey-reading:test:coverage
      - run: bun run dictionaries:test:coverage
      - run: bun run sentence-boundary:test:coverage
      - run: bun run parapper:test:coverage
      - run: bun run azookey-compare:test:coverage
      - run: bun run gateway:build
      - run: bun run gateway:test:coverage
      - run: bun run worker:typecheck
      - run: bun run worker:test:coverage
      # worker:typecheck regenerates the checked-in AzooKey WASM/archive; verify
      # the exact post-build bytes rather than only the checkout baseline.
      - run: bun run assets:verify
      - run: cargo build --locked --manifest-path packages/azookey-wasm/Cargo.toml --target wasm32-unknown-unknown --release
      - run: cargo build --locked --manifest-path packages/vibrato/wasm/Cargo.toml --target wasm32-unknown-unknown --release
      # WASM crate gates (fmt/clippy/test) sit beside the release build above so
      # a green quality job still proves the Worker ABI wrapper is clean.
      - run: bun run rust:wasm:fmt
      - run: bun run rust:wasm:lint
      - run: bun run rust:wasm:test
      - run: bun run parapper:lint
      # Parapper TypeScript gates are independent of the tao mock-app constraint
      # that blocks Rust UI tests on Linux; typecheck + vitest run here.
      - run: bun run parapper:typecheck
      - run: bun run parapper:test:ui
      # The quality action exports RUSTUP_TOOLCHAIN=1.97.1. Clear it for the
      # nested fork so its checked-in 1.90.0 pin is actually honored.
      - run: env -u RUSTUP_TOOLCHAIN bun run parapper:rust:fmt
      - run: env -u RUSTUP_TOOLCHAIN bun run parapper:rust:lint
      # Parapper's mock-app tests are gated cfg(not(macos)) and rely on
      # constructing one tao event loop per test. On Linux, tao can only ever
      # create one event loop per process (the glib main context stays owned by
      # the first test's thread), so the suite structurally cannot run here.
      # They execute in the Windows desktop-build job instead.
      - run: bun run rust:azookey:fmt
      - run: bun run rust:azookey:lint
      - run: bun run rust:azookey:test
      - run: bun run rust:input-lm:fmt
      - run: bun run rust:input-lm:lint
      - run: bun run rust:input-lm:test
      - run: bun run rust:zenz-verifier:fmt
      - run: bun run rust:zenz-verifier:lint
      - run: bun run rust:zenz-verifier:test
      - run: bun run rust:vibrato:fmt
      - run: bun run rust:vibrato:lint
      - run: bun run rust:vibrato:test

  native:
    name: Native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            node_platform: linux
          - platform: Windows
            os: windows-2025
            node_platform: win32
          - platform: macOS
            os: macos-14
            node_platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - name: Install Linux Native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake libasound2-dev libfontconfig-dev \
            libglib2.0-dev libssl-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev
      - name: Check Native formatting
        run: cargo fmt --manifest-path apps/native/Cargo.toml --all -- --check
      - name: Lint Native
        run: cargo clippy --locked --manifest-path apps/native/Cargo.toml --all-targets -- -D warnings
      - name: Test Native
        run: cargo test --locked --manifest-path apps/native/Cargo.toml
      - name: Build Native release
        run: cargo build --locked --release --manifest-path apps/native/Cargo.toml
      - name: Package Native release without launching it
        run: node scripts/package-native-release.mjs --platform ${{ matrix.node_platform }}
      - name: Upload Native release
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-beacon-native-${{ matrix.node_platform }}
          path: dist/
          if-no-files-found: error
