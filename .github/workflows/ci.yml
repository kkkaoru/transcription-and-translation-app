name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The AzooKey dictionary is a nested submodule of the checked-in
          # converter tree.  A shallow top-level checkout leaves the source
          # present but the dictionary files missing, which makes both the
          # hash check and the Rust conversion tests silently unusable.
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep this in lock-step with package.json's packageManager field.
          bun-version: 1.3.14
      - name: Verify the pinned Bun toolchain
        run: test "$(bun --version)" = "1.3.14"
      # Keep this in lock-step with the repository rust-toolchain.toml.  The
      # older 1.88 pin used to let CI pass while local desktop builds used a
      # different compiler and formatter.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Verify the pinned quality toolchain
        run: |
          set -euo pipefail
          rustc --version | grep -E '^rustc 1\.97\.1([[:space:]]|$)'
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
      - name: Install the nested Parapper toolchain components
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.90.0 rustfmt clippy
      - name: Install Linux desktop build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xvfb
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run assets:verify
      - run: bun run test:build-cleanup
      - run: bun run typecheck
      - run: bun run azookey-compare:typecheck
      - run: bun run check:single-app
      - run: bun run test:coverage
      - run: bun run core:test:coverage
      - run: bun run azookey-compare:test:coverage
      - run: bun run gateway:build
      - run: bun run gateway:test:coverage
      - run: bun run worker:typecheck
      - run: bun run worker:test:coverage
      # worker:typecheck regenerates the checked-in AzooKey WASM/archive; verify
      # the exact post-build bytes rather than only the checkout baseline.
      - run: bun run assets:verify
      - run: cargo build --locked --manifest-path packages/azookey-wasm/Cargo.toml --target wasm32-unknown-unknown --release
      - run: cargo build --locked --manifest-path packages/vibrato-wasm/Cargo.toml --target wasm32-unknown-unknown --release
      - run: bun run parapper:lint
      # The quality action exports RUSTUP_TOOLCHAIN=1.97.1. Clear it for the
      # nested fork so its checked-in 1.90.0 pin is actually honored.
      - run: env -u RUSTUP_TOOLCHAIN bun run parapper:rust:fmt
      - run: env -u RUSTUP_TOOLCHAIN bun run parapper:rust:lint
      # Parapper's mock-app tests are gated cfg(not(macos)) and rely on
      # constructing one tao event loop per test. On Linux, tao can only ever
      # create one event loop per process (the glib main context stays owned by
      # the first test's thread), so the suite structurally cannot run here.
      # They execute in the Windows desktop-build job instead.
      - run: bun run rust:azookey:fmt
      - run: bun run rust:azookey:lint
      - run: bun run rust:azookey:test
      - run: bun run rust:vibrato:fmt
      - run: bun run rust:vibrato:lint
      - run: bun run rust:vibrato:test
      - run: bun run rust:fmt
      - run: bun run rust:lint
      - run: bun run rust:desktop:test

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            architecture: arm64
            command: bun run tauri:build
          - os: macos-15-intel
            architecture: x86_64
            command: bun run tauri:build
          - os: windows-latest
            command: bun run tauri:build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: runner.os == 'macOS'
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        if: runner.os == 'Windows'
        with:
          # Desktop sidecars are built from tracked workspace sources. The
          # optional AzooKey/Parapper source submodules contain nested paths
          # beyond Windows MAX_PATH and are not needed by this job.
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep this in lock-step with package.json's packageManager field.
          bun-version: 1.3.14
      - name: Verify the pinned Bun toolchain (Unix)
        if: runner.os != 'Windows'
        run: test "$(bun --version)" = "1.3.14"
      - name: Verify the pinned Bun toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((bun --version).Trim() -ne "1.3.14") {
            throw "Expected Bun 1.3.14"
          }
      # Install Parapper's nested 1.90.0 pin. Desktop build scripts clear this
      # action's RUSTUP_TOOLCHAIN so the root app crate uses 1.97.1 instead.
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo install cargo-about --locked --features cli
      - run: bun install --frozen-lockfile
      - name: Report macOS signing and notarization prerequisites
        if: runner.os == 'macOS'
        env:
          KOTOBA_REQUIRE_APPLE_SIGNING: ${{ vars.KOTOBA_REQUIRE_APPLE_SIGNING || '0' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: bun run check:macos-signing
      - run: ${{ matrix.command }}
      - name: Verify universal Syphon packaging on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.architecture }}"
          app="apps/desktop/src-tauri/target/release/bundle/macos/Kotoba Beacon.app"
          framework="$app/Contents/Frameworks/Syphon.framework/Versions/A/Syphon"
          resources="$app/Contents/Frameworks/Syphon.framework/Versions/A/Resources"
          test -f "$framework"
          test -f "$resources/default.metallib"
          test -f "$resources/Info.plist"
          architectures="$(lipo -archs "$framework")"
          for required_architecture in arm64 x86_64; do
            case " $architectures " in
              *" $required_architecture "*) ;;
              *)
                echo "Syphon.framework is missing $required_architecture (found: $architectures)"
                exit 1
                ;;
            esac
          done
      # Parapper's mock-app tests cannot run on the Linux quality job (single
      # tao event loop per process) and are cfg'd out on macOS, so Windows is
      # the one CI platform that exercises them. RUSTUP_TOOLCHAIN=1.90.0 from
      # the toolchain action above matches Parapper's own pin.
      - if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path packages/parapper-asr/Cargo.toml -p parapper
      - run: bun run check:single-app
      - if: runner.os == 'macOS'
        run: bun run check:macos-autoswitch
