name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run gateway:build
      - run: bun run gateway:test:coverage
      - run: bun run worker:typecheck
      - run: bun run worker:test
      - run: bun run rust:azookey:fmt
      - run: bun run rust:azookey:lint
      - run: bun run rust:azookey:test

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: bun run tauri:build
          - os: windows-latest
            command: bun run tauri:build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.command }}
