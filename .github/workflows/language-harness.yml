name: Language Harness

on:
  pull_request:
    paths:
      - "crates/language-harness-core/**"
      - ".github/workflows/language-harness.yml"
  push:
    branches: [main]
    paths:
      - "crates/language-harness-core/**"
      - ".github/workflows/language-harness.yml"

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Check formatting
        run: cargo fmt --manifest-path crates/language-harness-core/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path crates/language-harness-core/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --manifest-path crates/language-harness-core/Cargo.toml
      - name: Coverage >= 95%
        run: make rust-language-harness-coverage
      - name: Browser WASM portability
        run: cargo build --locked --manifest-path crates/language-harness-core/Cargo.toml --target wasm32-unknown-unknown --release
