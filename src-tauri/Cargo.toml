[package]
name = "caption-bridge"
version = "0.1.0"
description = "Local bilingual caption overlay for OBS"
authors = ["Caption Bridge"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "caption_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5", features = ["tray-icon"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.16", features = ["v4", "fast-rng", "serde"] }

[target.'cfg(windows)'.dependencies]
spout2-rs = { version = "0.1.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
syphon-rs = { version = "0.1.1", optional = true }

[features]
default = []
# Enables the optional native output shims. The default transparent Tauri window
# works with OBS Window Capture on both desktop platforms.
native-output = ["dep:spout2-rs", "dep:syphon-rs"]
