[package]
name = "kotoba-beacon-native"
version = "0.1.0"
description = "Native GPUI app for Kotoba Beacon"
authors = ["Kotoba Beacon"]
edition = "2021"
rust-version = "1.97"
publish = false

[features]
default = ["gpui"]
gpui = ["dep:gpui", "dep:gpui-component", "dep:gpui_platform", "dep:signal-hook"]
translation-comparison = ["parapper-engine/translation-comparison"]

[[example]]
name = "translation_runtime_metrics"
required-features = ["translation-comparison"]

[dependencies]
anyhow = "1"
caption-bridge-audio = { path = "../../crates/caption-bridge-audio" }
caption-bridge-browser-source = { path = "../../crates/caption-bridge-browser-source" }
caption-bridge-captions = { path = "../../crates/caption-bridge-captions" }
caption-bridge-dictionary = { path = "../../crates/caption-bridge-dictionary" }
caption-bridge-identity = { path = "../../crates/caption-bridge-identity" }
caption-bridge-render = { path = "../../crates/caption-bridge-render" }
caption-bridge-spout = { path = "../../crates/caption-bridge-spout" }
caption-bridge-syphon = { path = "../../crates/caption-bridge-syphon" }
parapper-engine = { path = "../../crates/parapper-engine" }
rust_lib_kotoba_beacon_companion = { path = "../mobile/rust", default-features = false }
fs2 = "0.4"
getrandom = "0.3"
tungstenite = "0.28"
image = { version = "0.25", default-features = false }
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.3", optional = true }
thiserror = "2"
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", optional = true }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "ff3eb1128ac1058f1bb88e777744ce1237aa3b79", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", optional = true, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", optional = true, features = ["wayland", "x11"] }

[build-dependencies]
cc = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
