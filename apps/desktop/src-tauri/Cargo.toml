[package]
name = "kotoba-beacon"
version = "0.1.1"
description = "Local bilingual caption overlay for OBS"
authors = ["Kotoba Beacon"]
edition = "2021"
rust-version = "1.97"

[lib]
name = "caption_bridge_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22"
caption-bridge-azookey-rust = { path = "../../../packages/azookey-rust" }
caption-bridge-input-lm = { path = "../../../packages/input-lm-rust", features = ["rsmarisa"] }
# Off by default: this pulls in Candle, and through it the onig C library.
# Dependency resolution succeeds for all six targets but no non-macOS build
# has been run.
caption-bridge-zenz-verifier = {
    path = "../../../packages/zenz-verifier-rust",
    optional = true,
    default-features = false,
}
candle-core = { version = "0.11.0", optional = true, default-features = false }
caption-bridge-vibrato-core = { path = "../../../packages/vibrato/core" }
flate2 = "1.1"
log = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tauri = { version = "2.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2.7"
tauri-plugin-shell = "2.3"
tauri-plugin-updater = "2.10"
thiserror = "2.0"
tiny_http = "0.12"
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.12"
uuid = { version = "1.16", features = ["v4", "fast-rng", "serde"] }
url = "2.5"
# Multi-file archive model download (input-LM ZIP). `deflate-flate2` reuses
# the existing `flate2` dependency rather than pulling in a separate deflate
# backend; default features are off to avoid bzip2/lzma/zstd/xz/aes.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
spout2-rs = "0.1.1"

# The vendored Syphon.framework is a universal (arm64 + x86_64) build with the
# Metal server classes, so every macOS target links it.
[target.'cfg(target_os = "macos")'.dependencies]
syphon-rs = "0.1.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Direct Metal/ObjC bindings for examples such as `syphon_inspect` (CPU readback).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSRunLoop", "NSDate"] }
objc2-metal = { version = "0.3", features = [
  "MTLCommandBuffer",
  "MTLCommandQueue",
  "MTLDevice",
  "MTLPixelFormat",
  "MTLResource",
  "MTLTexture",
  "MTLTypes",
] }

[profile.release]
incremental = true
lto = false
codegen-units = 16
strip = "symbols"

# Manual `cargo build --profile dist` escape hatch. Signed `tauri:build:release`
# keeps Tauri's `target/release/` lookup and applies the same knobs through
# `CARGO_PROFILE_RELEASE_*` instead of `--profile dist`.
[profile.dist]
inherits = "release"
incremental = false
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[features]
default = ["native-output"]
# Kept for build-script compatibility. Platform-specific native output is on by
# default so macOS exposes Syphon and Windows exposes Spout2 in release builds.
native-output = []
# The embedded verifier is opt-in at build time as well as at runtime. Keeping
# Candle out of the default feature set avoids adding its native onig dependency
# to the normal desktop quality gate.
candle = [
    "dep:caption-bridge-zenz-verifier",
    "dep:candle-core",
    "caption-bridge-zenz-verifier/candle",
]
