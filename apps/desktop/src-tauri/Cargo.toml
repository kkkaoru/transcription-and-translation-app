[package]
name = "kotoba-beacon"
version = "0.1.1"
description = "Local bilingual caption overlay for OBS"
authors = ["Kotoba Beacon"]
edition = "2021"
rust-version = "1.97"

[lib]
name = "caption_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22"
caption-bridge-azookey-rust = { path = "../../../packages/azookey-rust" }
caption-bridge-input-lm = { path = "../../../packages/input-lm-rust", features = ["rsmarisa"] }
flate2 = "1.1"
log = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tauri = { version = "2.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2.7"
tauri-plugin-shell = "2.3"
tauri-plugin-updater = "2.10"
thiserror = "2.0"
tiny_http = "0.12"
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.12"
uuid = { version = "1.16", features = ["v4", "fast-rng", "serde"] }
url = "2.5"
# Multi-file archive model download (input-LM ZIP). `deflate-flate2` reuses
# the existing `flate2` dependency rather than pulling in a separate deflate
# backend; default features are off to avoid bzip2/lzma/zstd/xz/aes.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
spout2-rs = "0.1.1"

# The vendored Syphon.framework is a universal (arm64 + x86_64) build with the
# Metal server classes, so every macOS target links it.
[target.'cfg(target_os = "macos")'.dependencies]
syphon-rs = "0.1.1"

[features]
default = ["native-output"]
# Kept for build-script compatibility. Platform-specific native output is on by
# default so macOS exposes Syphon and Windows exposes Spout2 in release builds.
native-output = []
