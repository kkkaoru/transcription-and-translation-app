[package]
name = "kotoba-beacon"
version = "0.1.1"
description = "Local bilingual caption overlay for OBS"
authors = ["Kotoba Beacon"]
edition = "2021"
rust-version = "1.97"

[lib]
name = "caption_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22"
caption-bridge-azookey-rust = { path = "../../../packages/azookey-rust" }
flate2 = "1.1"
log = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tauri = { version = "2.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2.7"
tauri-plugin-shell = "2.3"
tauri-plugin-updater = "2.10"
thiserror = "2.0"
tiny_http = "0.12"
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.16", features = ["v4", "fast-rng", "serde"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
spout2-rs = "0.1.1"

# The vendored Syphon.framework is currently x86_64-only.  Do not link it into
# an Apple-silicon build: the linker otherwise emits a non-fatal warning and
# the runtime only falls back to the transparent overlay after startup.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
syphon-rs = "0.1.1"

[features]
default = ["native-output"]
# Kept for build-script compatibility. Platform-specific native output is on by
# default so macOS exposes Syphon and Windows exposes Spout2 in release builds.
native-output = []
