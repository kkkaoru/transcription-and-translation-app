[package]
name = "rust_lib_kotoba_beacon_companion"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["flutter"]
flutter = ["dep:flutter_rust_bridge"]

[dependencies]
caption-bridge-azookey-rust = { path = "../../../packages/azookey-rust" }
flate2 = "1"
flutter_rust_bridge = { version = "=2.13.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
