[package]
name = "caption-bridge-browser-source"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Framework-agnostic OBS Browser Source loopback HTTP caption server without a Tauri AppHandle."
license = "MIT"

[dependencies]
caption-bridge-fonts = { path = "../caption-bridge-fonts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny_http = "0.12"
