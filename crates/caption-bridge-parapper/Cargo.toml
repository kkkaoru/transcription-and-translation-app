[package]
name = "caption-bridge-parapper"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Pure Parapper recognition protocol, output queue, and optional WebSocket client"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "native-tls", "url"] }
