[package]
name = "caption-bridge-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Framework-agnostic argument builders and child-process supervisor for the Kotoba Beacon sidecars (Parapper, inference-gateway, llama-server, zenz-server) without Tauri's sidecar plugin."

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"