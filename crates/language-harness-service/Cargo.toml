[package]
name = "language-harness-service"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.8"
language-harness-core = { path = "../language-harness-core" }
ort = "=2.0.0-rc.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "sync"] }

[lints.rust]
unsafe_code = "forbid"
