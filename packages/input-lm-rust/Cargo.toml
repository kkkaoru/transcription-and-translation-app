[package]
name = "caption-bridge-input-lm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
# Only pulled for parsing `vocab.json` at runtime or at compile time when the
# embedded-vocab feature is on. `merges.txt` and the byte table are handled
# without any crate. The OS default is dependency-free apart from this.
serde_json = "1"
rsmarisa = { version = "0.4.2", features = ["mmap"], optional = true }

[dev-dependencies]

[features]
# Off by default: the core crate stays dependency-free, and only this feature
# pulls in a MARISA reader.
rsmarisa = ["dep:rsmarisa"]

[[example]]
name = "probe_model"
required-features = ["rsmarisa"]

[[example]]
name = "dump_keys"
required-features = ["rsmarisa"]

[[example]]
name = "check_consistency"
required-features = ["rsmarisa"]

[[example]]
name = "rescore_measure"
required-features = ["rsmarisa"]

[[example]]
name = "rescore_sweep"
required-features = ["rsmarisa"]
