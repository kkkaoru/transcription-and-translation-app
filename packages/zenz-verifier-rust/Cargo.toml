[package]
name = "caption-bridge-zenz-verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
caption-bridge-azookey-rust = { path = "../azookey-rust" }
caption-bridge-input-lm = { path = "../input-lm-rust" }
unicode-segmentation = "1.12"
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }

[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn"]
