[package]
name = "caption-bridge-vibrato-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Minimal WebAssembly wrapper around Vibrato-rkyv tokenization"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
caption-bridge-vibrato-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
vibrato = { version = "=0.5.2", default-features = false }
zstd = "0.13"
